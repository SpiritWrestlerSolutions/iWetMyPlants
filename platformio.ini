; iWetMyPlants 2.0 - one firmware, built for two chips.
;
;   pio run -e esp32 -e esp32c3      build both
;   pio test -e native               logic tests on the PC (needs a native gcc; CI always runs them)

[platformio]
default_envs = esp32, esp32c3

; Shared by both chips. [env:native] does not extend this, so tests never pull in Arduino.
[esp]
platform = espressif32@6.12.0
framework = arduino
board_build.partitions = min_spiffs.csv
; embed_files, not embed_txtfiles: the txt variant edits the source file in place while building
board_build.embed_files = src/index.html
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@7.4.3
extra_scripts = pre:scripts/version.py
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=1
test_ignore = *

[env:esp32]
extends = esp
board = esp32dev

[env:esp32c3]
extends = esp
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
monitor_rts = 0
monitor_dtr = 0
build_flags =
    ${esp.build_flags}
    -DIWMP_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
lib_deps = bblanchon/ArduinoJson@7.4.3
build_flags = -std=c++17
; config.cpp's JSON and validation code is portable; its NVS part is behind #ifdef ARDUINO
test_build_src = yes
build_src_filter = -<*> +<config.cpp>
